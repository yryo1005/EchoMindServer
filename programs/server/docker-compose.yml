services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echomind
      POSTGRES_PASSWORD: echomind
      POSTGRES_DB: echomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echomind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
