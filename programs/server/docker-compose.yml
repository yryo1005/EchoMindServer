services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: echomind
      POSTGRES_PASSWORD: echomind
      POSTGRES_DB: echomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloudflare Tunnel: 自宅サーバー(localhost:8000で動くuvicorn)を
  # 既存ドメイン(stargazyguys.com)のサブドメインから安全に公開する．
  # CLOUDFLARE_TUNNEL_TOKENは.env(Git管理対象外)で指定する．
  # セットアップ手順は .reports/report_006.md を参照．
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host

volumes:
  pgdata:
